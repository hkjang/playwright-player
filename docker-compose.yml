services:
  playwright-player:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ipc: host
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DEFAULT_HEADLESS: "true"
      ENABLE_EVALUATE: "true"
      # Set API_TOKEN for any deployment reachable beyond localhost.
      # API_TOKEN: "change-me"
      # Restrict which hosts sessions may navigate to:
      # URL_ALLOWLIST: "example.com,*.internal.example.com"
    volumes:
      # ./data holds run history and evidence and must be kept across restarts.
      # The entrypoint aligns its ownership with the container user on boot.
      - ./scripts:/app/scripts
      - ./storage-states:/app/storage-states
      - ./data:/app/data
